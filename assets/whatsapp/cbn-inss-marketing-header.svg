<svg xmlns="http://www.w3.org/2000/svg" width="800" height="418" viewBox="0 0 800 418" role="img" aria-labelledby="title desc">
  <title id="title">CBN Crédito — Crédito para beneficiários INSS</title>
  <desc id="desc">Cabeçalho azul-marinho com detalhes turquesa e verdes para modelo oficial de WhatsApp.</desc>
  <defs>
