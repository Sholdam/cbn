# Synthetic-only foundation. This is intentionally not the production stack:
# storage, n8n, WAHA, Telegram and ingress are gated in the migration plan.
name: cbn-infra-synthetic

x-chatwoot-environment: &chatwoot-environment
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  ENABLE_ACCOUNT_SIGNUP: "false"
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot_synthetic}
  POSTGRES_USERNAME: ${POSTGRES_USER:-chatwoot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a synthetic password in infra/.env}
  REDIS_URL: redis://redis:6379
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?Set a synthetic key in infra/.env}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?Set a synthetic key in infra/.env}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?Set a synthetic key in infra/.env}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?Set a synthetic key in infra/.env}
  ACTIVE_STORAGE_SERVICE: local

x-chatwoot-build: &chatwoot-build
  image: cbn/chatwoot:4.16.2-cbn-local
  build:
    context: ../chatwoot-cbn
    dockerfile: Dockerfile
  profiles: [synthetic]
  restart: unless-stopped
  environment: *chatwoot-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [backend]

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    profiles: [synthetic]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_synthetic}
      POSTGRES_USER: ${POSTGRES_USER:-chatwoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a synthetic password in infra/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:8.2.1}
    profiles: [synthetic]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  chatwoot-web:
    <<: *chatwoot-build
    networks: [backend, frontend]
    entrypoint: [docker/entrypoints/rails.sh]
    command: [bundle, exec, rails, s, -p, "3000", -b, 0.0.0.0]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - chatwoot_storage:/app/storage
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, 'response = Net::HTTP.get_response(URI("http://127.0.0.1:3000/")); exit(response.is_a?(Net::HTTPSuccess) || response.is_a?(Net::HTTPRedirection) ? 0 : 1)']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  chatwoot-sidekiq:
    <<: *chatwoot-build
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
    volumes:
      - chatwoot_storage:/app/storage
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, bundle, exec, ruby, -rsidekiq/api, -e, 'exit(Sidekiq::ProcessSet.new.size.positive? ? 0 : 1)']
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  chatwoot_storage:

networks:
  backend:
    internal: true
  frontend: {}
