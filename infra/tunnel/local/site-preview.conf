server {
    listen 127.0.0.1:3901;
    server_name _;
    absolute_redirect off;

    location = /site {
        return 308 /site/;
    }

    location /site/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
